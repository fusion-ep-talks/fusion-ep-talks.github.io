# ==============================================================================
# Weekly link checker for the Resources / Opportunities data files
# File: .github/workflows/link-check.yml
#
# Every Monday (and whenever you press "Run workflow" in the Actions tab) it
# checks every link written in _data/*.yml. If some are broken, it opens a
# GitHub Issue named "Broken links report" listing them. It never changes
# your site.
#
# Notes
#   - "example.org" links (used in the commented templates) are ignored.
#   - Status 403 and 429 are treated as OK: many sites block bots or rate
#     limit them even though the page works in a browser.
#   - Requires: Settings > Actions > General > Workflow permissions set to
#     "Read and write permissions" (so the workflow can open the issue).
# ==============================================================================
name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links in data files
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --accept '200..=299,403,429'
            --exclude 'example\.org'
            './_data/*.yml'
          output: ./lychee-report.md
          fail: false

      - name: Open an issue if there are broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee-report.md
          labels: link-check
