# ==============================================================================
# FUSION EP Talks - Opportunities Board Data
# File: _data/opportunities.yml
#
# HOW TO ADD AN OPPORTUNITY
#   1. Copy the template for the right type from the TEMPLATES block below.
#   2. Paste it in the matching section further down (order does not matter:
#      the page sorts by deadline automatically).
#   3. Remove the leading "# " from every line and fill in the values.
#
# TYPES (the "type" field must be exactly one of these)
#   "master"      Master's degree programme
#   "phd"         PhD position
#   "postdoc"     Postdoctoral position
#   "school"      Summer school / workshop
#   "internship"  Internship or internship grant
#   "job"         Job (industry, labs, etc.)
#   Summer schools and internships share one filter button on the page,
#   but keep their own badge.
#
# DEADLINE (the "deadline" field accepts exactly three kinds of value)
#   "YYYY-MM-DD"  A real date, e.g. "2027-03-31". The card moves automatically
#                 to the "closed" archive after that day (at the next site build).
#                 Cards with a deadline within 14 days get a "Closing soon" tag.
#   "ongoing"     Rolling applications. Never expires.
#   "TBA"         Deadline not announced yet. Never expires, shows "Deadline TBA".
#   Capitals and extra spaces are ignored ("Ongoing", " tba " also work).
#   Anything else (typos, empty) still shows the card, with a visible
#   "Check deadline" warning, so mistakes are easy to spot.
#   Always wrap the value in quotes.
#
# FIELDS
#   Required : title, type, deadline
#   Recommended: institution, location, link, description
#   Optional : funding (hidden if empty), posted
#   "posted" is internal only (YYYY-MM-DD, date you added the entry). It is
#   never shown on the card; it is stored as data-posted on the HTML element
#   in case we want "New" badges or sorting later.
#   Fields left out or left as "" are simply not displayed.
#
# Remember: do not paste job contract details. We only link to the original
# announcement; the "Official Details & Apply" button leads there.
# ==============================================================================


